# The agent pipeline (ARCHITECTURE.md, "Agent pipeline"): an issue labeled agent-ready by the owner
# (or by the agent, for sub-issues and release issues) is triaged by Claude, and a ready one is built
# and opened as a PR. An approved split becomes sub-issues, and a closed issue can unblock them or
# start a release. Claude never holds a write token: it returns its results as structured output, and
# fixed steps post comments, set labels, create issues, check its commits and publish them. Keep this
# file's name: the Anthropic federation rule accepts only .github/workflows/agent.yml on main, so no
# other workflow can get a token.
name: Agent

on:
  issues:
    types: [labeled, closed]

permissions: {}

jobs:
  triage:
    name: Triage
    # claude[bot] labels the sub-issues and release issues it creates (the jobs below), and only those.
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'agent-ready' &&
      (github.event.sender.login == github.repository_owner ||
      (github.event.sender.login == 'claude[bot]' && github.event.issue.user.login == 'claude[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One triage at a time; the rest wait in order (ARCHITECTURE.md, "Triggers and who can start a run").
    concurrency:
      group: agent-triage
      cancel-in-progress: false
      queue: max
    env:
      MODEL: claude-sonnet-5-5
    permissions:
      contents: read
      issues: read
      id-token: write # only for the Anthropic token exchange; GitHub access is this job's read-only token
    outputs:
      result: ${{ steps.claude.outputs.structured_output }}
      decision: ${{ steps.decision.outputs.decision }}
      complexity: ${{ steps.decision.outputs.complexity }}
      cost: ${{ steps.cost.outputs.usd }}
      model: ${{ env.MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect the issue and its thread
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_JSON: ${{ toJSON(github.event.issue) }}
          OWNER: ${{ github.repository_owner }}
        run: bash .github/agent/collect.sh

      - name: Triage
        id: claude
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # The job's own read-only token. Without it the Action fetches a write-scoped Claude App token.
          github_token: ${{ github.token }}
          # The Action refuses runs a bot started unless it is listed. The job's own if: already limits
          # claude[bot] to issues it created.
          allowed_bots: claude[bot]
          prompt: Triage the issue in .agent-input/ by following .github/agent/triage.md.
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 40
            --allowedTools Read,Grep,Glob
            --disallowedTools Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch
            --json-schema '{"type":"object","properties":{"decision":{"type":"string","enum":["questions","split","approved_split","ready"]},"complexity":{"type":"string","enum":["routine","complex"]},"comment":{"type":"string","minLength":1,"maxLength":6000},"subissues":{"type":"array","minItems":2,"maxItems":8,"items":{"type":"object","properties":{"title":{"type":"string","minLength":1,"maxLength":100},"body":{"type":"string","minLength":1,"maxLength":2000},"blocked_by":{"type":"array","items":{"type":"integer","minimum":1}}},"required":["title","body","blocked_by"],"additionalProperties":false}}},"required":["decision","comment"],"additionalProperties":false}'

      - name: Read the decision
        id: decision
        if: always()
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          decision=$(jq -r '.decision // empty' <<<"${RESULT:-null}" 2>/dev/null || true)
          case "$decision" in questions | split | approved_split | ready) ;; *) decision="" ;; esac
          # A split needs 2-8 sub-issues, each blocked only by ones listed before it (so no cycles),
          # and no HTML comments: those wouldn't show in the proposal the owner approves.
          if [ "$decision" = split ] && ! jq -e -f .github/agent/split-valid.jq <<<"$RESULT" >/dev/null 2>&1; then
            decision=""
          fi
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          # Which model builds a ready issue (ARCHITECTURE.md, "Coding run"): only "routine" gets the
          # cheaper one; anything else, including no answer, gets the default.
          complexity=$(jq -r '.complexity // empty' <<<"${RESULT:-null}" 2>/dev/null || true)
          [ "$complexity" = routine ] || complexity=complex
          echo "complexity=$complexity" >> "$GITHUB_OUTPUT"

      - name: Read the run's cost
        id: cost
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          usd=$(jq -r '[.[] | select(.type == "result")] | last | .total_cost_usd // empty' "$EXECUTION_FILE" 2>/dev/null || true)
          echo "usd=$usd" >> "$GITHUB_OUTPUT"

  respond:
    name: Post the triage result
    needs: triage
    if: always() && needs.triage.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Comment and set labels
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          TRIAGE: ${{ needs.triage.result }}
          DECISION: ${{ needs.triage.outputs.decision }}
          RESULT: ${{ needs.triage.outputs.result }}
          COST: ${{ needs.triage.outputs.cost }}
          MODEL: ${{ needs.triage.outputs.model }}
          COMPLEXITY: ${{ needs.triage.outputs.complexity }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          remove_label() { gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels/$1" >/dev/null 2>&1 || true; }

          decision=$DECISION
          comment=$(jq -r '.comment // empty' <<<"${RESULT:-null}" 2>/dev/null || true)
          if [ "$TRIAGE" != "success" ] || [ -z "$decision" ] || [ -z "$comment" ]; then
            decision=failed
            comment="Triage didn't finish. The run's log has the details; re-add \`agent-ready\` to try again."
          fi

          footer="Triage by Claude (${MODEL:-unknown model}) · [run]($RUN_URL)"
          if [ -n "${COST:-}" ]; then footer="$footer · \$$(printf '%.2f' "$COST")"; fi
          case "$decision" in
            questions) next="Answer with numbered replies, then re-add \`agent-ready\`." ;;
            split) next="Reply starting \"approved\" (or with changes), then re-add \`agent-ready\`. The sub-issues are created from this comment as written." ;;
            approved_split) next="Creating the sub-issues now." ;;
            ready)
              builder=$([ "$COMPLEXITY" = routine ] && echo "Sonnet, as routine work" || echo "Opus")
              next="Building it now with $builder. A PR, or questions, will follow here." ;;
            *) next="" ;;
          esac

          # A split's sub-issues are shown as they'll be created, and also kept in the comment as data:
          # on approval, the Split job creates them from this comment, not from new output.
          proposal=""
          if [ "$decision" = split ]; then
            proposal=$(jq -r '.subissues | to_entries[] |
              "#### \(.key + 1). \(.value.title)\n\n\(.value.body)\n" +
              (if (.value.blocked_by | length) > 0 then "\n_Blocked by \(.value.blocked_by | map(tostring) | join(", "))._\n" else "" end)' \
              <<<"$RESULT")
            proposal=$(printf '%s\n\n<!-- agent-split:%s -->' "$proposal" "$(jq -c .subissues <<<"$RESULT" | gzip -9n | base64 -w0)")
          fi

          { printf '%s\n\n' "$comment"; [ -z "$proposal" ] || printf '%s\n\n' "$proposal"
            [ -z "$next" ] || printf '%s\n\n' "$next"; printf '<sub>%s</sub>\n' "$footer"; } \
            | gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file -

          # agent-ready comes off after every run, so re-adding it is what starts the next one.
          remove_label agent-ready
          remove_label agent-needs-info
          case "$decision" in
            questions | split) gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label agent-needs-info ;;
          esac

  # An approved split (ARCHITECTURE.md, "Triage"): creates the sub-issues from the proposal the owner
  # approved, word for word, in the parent's milestone, links them, and starts the unblocked ones.
  # Claude only judged that the owner approved; the text comes from the posted proposal.
  split:
    name: Create the sub-issues
    needs: [triage, respond]
    if: always() && needs.triage.outputs.decision == 'approved_split'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: agent-split-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write # comments on the parent
      id-token: write # the Claude App token below: issues, and contents read (the exchange requires it)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/agent

      - name: Create, link and label them
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          repo=$GITHUB_REPOSITORY
          say() { printf '%s\n\n<sub>Sub-issues · [run](%s)</sub>\n' "$1" "$RUN_URL" | gh issue comment "$ISSUE" --repo "$repo" --body-file -; }
          stop() { say "No sub-issues were created: $1"; exit 0; }

          # The newest proposal, and a reply from the owner after it starting "approved" (Claude judged
          # the approval too; this doesn't rest on that alone).
          gh api --paginate "repos/$repo/issues/$ISSUE/comments" --jq '.[]' | jq -s . > comments.json
          proposal=$(jq -r '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- agent-split:")))] | last // empty' comments.json)
          [ -n "$proposal" ] || stop "there's no split proposal on this issue to create them from."
          proposed_at=$(jq -r .created_at <<<"$proposal")
          jq -e --arg owner "$OWNER" --arg at "$proposed_at" \
            'any(.[]; .user.login == $owner and .created_at > $at and (.body | ascii_downcase | test("^[[:space:]]*approved")))' comments.json >/dev/null \
            || stop "there's no reply from the owner starting \"approved\" after the latest proposal."
          # The last marker is the workflow's own (it comes after Claude's text), checked again here.
          subs=$(jq -r '[.body | match("<!-- agent-split:([A-Za-z0-9+/=]+) -->"; "g")] | last | .captures[0].string' <<<"$proposal" \
            | base64 -d | gunzip)
          jq '{subissues: .}' <<<"$subs" | jq -e -f .github/agent/split-valid.jq >/dev/null \
            || stop "the proposal's data didn't pass the checks."
          n=$(jq length <<<"$subs")
          [ "$(gh api "repos/$repo/issues/$ISSUE/sub_issues" --jq length)" = 0 ] \
            || stop "this issue already has sub-issues. Add any more by hand."
          milestone=$(gh api "repos/$repo/issues/$ISSUE" --jq '.milestone.title // empty')
          ms=(); [ -z "$milestone" ] || ms=(--milestone "$milestone")

          # A Claude App token: issues it creates and labels start runs, and ones made with this job's
          # own token wouldn't.
          source .github/agent/app-token.sh
          get_app_token '{"issues":"write"}' \
            || stop "couldn't get a Claude App token (the run's log has the reason). Re-add \`agent-ready\` to try again."

          # If anything fails part way, say what exists so far.
          nums=(); ids=(); finished=0
          cleanup() {
            curl -sS -X DELETE https://api.github.com/installation/token -H "Authorization: Bearer $token" >/dev/null || true
            if [ "$finished" != 1 ]; then
              created=""; for num in "${nums[@]}"; do created+="#$num "; done
              say "Creating the sub-issues stopped part way (created so far: ${created:-none}). The run's log has the details; finish by hand rather than re-running, which would refuse now that sub-issues exist."
            fi
          }
          trap cleanup EXIT
          as_app() { GH_TOKEN="$token" "$@"; }

          for i in $(seq 0 $((n - 1))); do
            { jq -r ".[$i].body" <<<"$subs"; printf '\nPart of #%s.\n' "$ISSUE"; } > body.md
            url=$(as_app gh issue create --repo "$repo" --title "$(jq -r ".[$i].title" <<<"$subs")" --body-file body.md "${ms[@]}")
            nums+=("${url##*/}")
            ids+=("$(gh api "repos/$repo/issues/${url##*/}" --jq .id)")
            as_app gh api -X POST "repos/$repo/issues/$ISSUE/sub_issues" -F "sub_issue_id=${ids[$i]}" >/dev/null
          done
          lines=(); start=()
          for i in $(seq 0 $((n - 1))); do
            blockers=$(jq -r ".[$i].blocked_by[]" <<<"$subs")
            refs=()
            for b in $blockers; do
              as_app gh api -X POST "repos/$repo/issues/${nums[$i]}/dependencies/blocked_by" -F "issue_id=${ids[$((b - 1))]}" >/dev/null
              refs+=("#${nums[$((b - 1))]}")
            done
            if [ ${#refs[@]} -eq 0 ]; then
              lines+=("- #${nums[$i]}"); start+=("${nums[$i]}")
            else
              lines+=("- #${nums[$i]}, blocked by ${refs[*]}")
            fi
          done
          # Labeled last, so each run sees its parent and blockers already linked.
          for num in "${start[@]}"; do
            as_app gh issue edit "$num" --repo "$repo" --add-label agent-ready
          done
          finished=1
          say "$(printf 'Created the sub-issues:\n\n%s\n\nThe unblocked ones start now; a blocked one starts when its blockers are closed as completed. This issue closes when they all have.' "$(printf '%s\n' "${lines[@]}")")"

  code:
    name: Code
    needs: triage
    if: needs.triage.outputs.decision == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # One coding run at a time, in its own group so another issue's triage can't replace it; the rest
    # wait in order.
    concurrency:
      group: agent-code
      cancel-in-progress: false
      queue: max
    env:
      # Sonnet for what triage judged routine (mechanical, fully planned), Opus otherwise.
      MODEL: ${{ needs.triage.outputs.complexity == 'routine' && 'claude-sonnet-5-5' || 'claude-opus-5-5' }}
      # Claude's shell commands run sandboxed, with secrets removed from their environment. The
      # accepted risk this reduces is in ARCHITECTURE.md ("Where it lives").
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    permissions:
      contents: read
      issues: read
      id-token: write # only for the Anthropic token exchange; GitHub access is this job's read-only token
    outputs:
      status: ${{ steps.branch.outputs.status || steps.bundle.outputs.status || steps.result.outputs.status }}
      result: ${{ steps.claude.outputs.structured_output }}
      comment: ${{ steps.result.outputs.comment }}
      branch: ${{ steps.branch.outputs.branch }}
      cost: ${{ steps.cost.outputs.usd }}
      model: ${{ env.MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # One branch per issue (ARCHITECTURE.md, "Coding run").
      - name: Choose the branch
        id: branch
        env:
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          slug=$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-*//' | cut -c1-40 | sed 's/-*$//')
          branch="agent/issue-$ISSUE-${slug:-change}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --heads origin | awk '{print $2}' | grep -qE "^refs/heads/agent/issue-$ISSUE(-|$)"; then
            echo "status=exists" >> "$GITHUB_OUTPUT"
          else
            git switch --quiet -c "$branch"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.branch.outputs.status != 'exists'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies, browsers and the sandbox
        if: steps.branch.outputs.status != 'exists'
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          # Ubuntu 24.04 restricts unprivileged user namespaces, which the sandbox needs.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Collect the issue, its thread and the plan
        if: steps.branch.outputs.status != 'exists'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_JSON: ${{ toJSON(github.event.issue) }}
          OWNER: ${{ github.repository_owner }}
          TRIAGE_RESULT: ${{ needs.triage.outputs.result }}
        run: |
          bash .github/agent/collect.sh
          jq -r '.comment' <<<"$TRIAGE_RESULT" > .agent-input/plan.md

      - name: Build it
        id: claude
        if: steps.branch.outputs.status != 'exists'
        timeout-minutes: 45
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # Read-only: Claude commits locally and can't push. The publish job does that.
          github_token: ${{ github.token }}
          # The Action refuses runs a bot started unless it is listed. The job's own if: already limits
          # claude[bot] to issues it created.
          allowed_bots: claude[bot]
          prompt: Build the issue in .agent-input/ by following .github/agent/code.md. You're on branch ${{ steps.branch.outputs.branch }}.
          claude_args: |
            --model ${{ env.MODEL }}
            --max-turns 300
            --allowedTools "Read" "Grep" "Glob" "Edit" "Write" "TodoWrite" "Task" "Agent" "Bash(npm run:*)" "Bash(npm test:*)" "Bash(npx prettier:*)" "Bash(npx vitest:*)" "Bash(npx playwright test:*)" "Bash(npx tsc:*)" "Bash(npx oxlint:*)" "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" "Bash(git add:*)" "Bash(git commit:*)" "Bash(git restore:*)" "Bash(git rm:*)" "Bash(git mv:*)" "Bash(git grep:*)" "Bash(ls:*)" "Bash(wc:*)"
            --disallowedTools "WebFetch" "WebSearch" "NotebookEdit" "Bash(git push:*)" "Bash(npm install:*)" "Bash(npm i:*)" "Bash(curl:*)" "Bash(wget:*)"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["done","questions"]},"pr_title":{"type":"string","maxLength":100},"pr_body":{"type":"string","maxLength":6000},"touches_data":{"type":"boolean"},"comment":{"type":"string","minLength":1,"maxLength":6000}},"required":["status","comment"],"additionalProperties":false}'

      - name: Read the run's cost
        id: cost
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          usd=$(jq -r '[.[] | select(.type == "result")] | last | .total_cost_usd // empty' "$EXECUTION_FILE" 2>/dev/null || true)
          echo "usd=$usd" >> "$GITHUB_OUTPUT"

      - name: Read the result
        id: result
        if: always() && steps.claude.outcome != 'skipped'
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          status=$(jq -r '.status // empty' <<<"${RESULT:-null}" 2>/dev/null || true)
          case "$status" in done | questions) ;; *) status=failed ;; esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo 'comment<<AGENT_EOF'
            jq -r '.comment // empty' <<<"${RESULT:-null}" 2>/dev/null | grep -v '^AGENT_EOF$' || true
            echo 'AGENT_EOF'
          } >> "$GITHUB_OUTPUT"

      # The commits leave this job as a bundle. The publish job, on a fresh machine, checks them.
      - name: Bundle the commits
        id: bundle
        if: steps.result.outputs.status == 'done'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git() { command git -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          if [ "$(git rev-list --count "origin/main..$BRANCH")" -eq 0 ]; then
            echo "status=empty" >> "$GITHUB_OUTPUT"
          else
            git bundle create "$RUNNER_TEMP/agent.bundle" "origin/main..$BRANCH"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.result.outputs.status == 'done' && steps.bundle.outputs.status != 'empty'
        with:
          name: agent-commits
          path: ${{ runner.temp }}/agent.bundle
          retention-days: 1
          overwrite: true

  # Runs on a fresh machine, so nothing left over from Claude's job can reach the write token. Trusts
  # nothing from the code job but its commits and text, and checks the commits before pushing.
  publish:
    name: Publish
    needs: code
    if: needs.code.outputs.status == 'done'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # the Claude App token below, limited to contents and pull requests
    outputs:
      status: ${{ steps.publish.outputs.status }}
      reason: ${{ steps.publish.outputs.reason }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-commits
          path: ${{ runner.temp }}/agent

      - name: Check and publish
        id: publish
        env:
          BRANCH: ${{ needs.code.outputs.branch }}
          ISSUE: ${{ github.event.issue.number }}
          RESULT: ${{ needs.code.outputs.result }}
          COST: ${{ needs.code.outputs.cost }}
          MODEL: ${{ needs.code.outputs.model }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          refuse() { echo "status=refused" >> "$GITHUB_OUTPUT"; echo "reason=$1" >> "$GITHUB_OUTPUT"; echo "::warning::$1"; exit 0; }
          case "$BRANCH" in agent/issue-"$ISSUE"-*) ;; *) refuse "The branch name wasn't an agent branch for this issue." ;; esac

          git clone --quiet --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" publish
          cd publish
          git fetch --quiet "$RUNNER_TEMP/agent/agent.bundle" "+refs/heads/$BRANCH:refs/heads/$BRANCH" \
            || refuse "There were no commits to publish, or they couldn't be read back."
          [ "$(git rev-list --count "origin/main..$BRANCH")" -gt 0 ] || refuse "There were no commits to publish."
          # --no-renames, so a file moved out of a guarded folder shows up under its old path too.
          changed=$(git diff --no-renames --name-only "origin/main...$BRANCH")
          guarded=$(grep -E '^(\.github/(workflows|rulesets|agent)/|\.claude/|\.npmrc$)' <<<"$changed" | tr '\n' ' ' || true)
          [ -z "$guarded" ] || refuse "The commits change paths the agent may not edit: $guarded"
          # Only the version may change in package.json and package-lock.json (as a release does): no
          # dependencies, overrides, scripts or resolved packages.
          pkg() { git show "$1:package.json" | jq -S 'del(.version)'; }
          lock() { git show "$1:package-lock.json" | jq -S 'del(.version, .packages[""].version)'; }
          [ "$(pkg origin/main)" = "$(pkg "$BRANCH")" ] && [ "$(lock origin/main)" = "$(lock "$BRANCH")" ] \
            || refuse "The commits change package.json or package-lock.json beyond the version, which the agent may not do."

          # Labels that ask the owner to look before merging (ARCHITECTURE.md, "Merge safety").
          labels=()
          if grep -q '^src/storage/' <<<"$changed" || [ "$(jq -r '.touches_data // false' <<<"$RESULT")" = true ]; then
            labels+=(touches-data)
          fi
          # Files that decide what "green" means: the check scripts, lint, format, type and test config,
          # and the security headers and hosting.
          if grep -qE '^(scripts/|\.oxlintrc\.json$|\.prettier|playwright\.config\.ts$|vite\.config\.ts$|tsconfig[^/]*\.json$|public/_headers$|wrangler\.jsonc$)' <<<"$changed"; then
            labels+=(touches-gates)
          fi
          title=$(jq -r '.pr_title // empty' <<<"$RESULT")
          [ -n "$title" ] || title="Issue #$ISSUE"
          footer="Built by Claude (${MODEL:-unknown model}) from #$ISSUE · [run]($RUN_URL)"
          if [ -n "${COST:-}" ]; then footer="$footer · \$$(printf '%.2f' "$COST")"; fi
          # The attribution line is the footer's; Claude Code adds its own, which would show twice.
          {
            jq -r '.pr_body // empty' <<<"$RESULT" | sed '/Generated with \[Claude Code\]/d'
            printf '\nCloses #%s\n\n<sub>%s</sub>\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n' "$ISSUE" "$footer"
          } > "$RUNNER_TEMP/pr-body.md"

          # A Claude App token, got the way the Action gets one, limited to pushing and opening the PR.
          # A PR opened with it runs CI; one opened with the default token wouldn't.
          oidc=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claude-code-github-action" | jq -r '.value // empty') || true
          [ -n "$oidc" ] || refuse "Couldn't get a GitHub identity token to publish with."
          echo "::add-mask::$oidc"
          token=$(curl -sS -X POST https://api.anthropic.com/api/github/github-app-token-exchange \
            -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' \
            -d '{"permissions":{"contents":"write","pull_requests":"write"}}' | jq -r '.token // .app_token // empty') || true
          [ -n "$token" ] || refuse "Couldn't get a Claude App token to publish with."
          echo "::add-mask::$token"
          trap 'curl -sS -X DELETE https://api.github.com/installation/token -H "Authorization: Bearer $token" >/dev/null || true' EXIT
          auth=$(printf 'x-access-token:%s' "$token" | base64 -w0)
          echo "::add-mask::$auth"

          # Checked again here: an edited title gives a different branch name, so the Code job's check
          # alone could let one issue get two branches.
          if git ls-remote --heads origin | awk '{print $2}' | grep -qE "^refs/heads/agent/issue-$ISSUE(-|$)"; then
            echo "status=exists" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push --quiet origin "refs/heads/$BRANCH:refs/heads/$BRANCH"
          echo "reason=The branch \`$BRANCH\` was pushed but the PR wasn't opened. Open it by hand, or delete the branch and re-add \`agent-ready\`." >> "$GITHUB_OUTPUT"
          pr_url=$(GH_TOKEN="$token" gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "$title" --body-file "$RUNNER_TEMP/pr-body.md")
          echo "status=published" >> "$GITHUB_OUTPUT"
          for label in "${labels[@]}"; do
            GH_TOKEN="$token" gh pr edit "$pr_url" --add-label "$label" \
              || echo "::warning::Couldn't add the $label label to $pr_url; add it by hand."
          done

  # When there's a PR, it's the report: it closes the issue and carries the run and cost. This job
  # comments only when there isn't one, so a run never ends silently.
  report:
    name: Report a run without a PR
    needs: [code, publish]
    if: always() && needs.code.result != 'skipped' && needs.publish.outputs.status != 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          CODE: ${{ needs.code.result }}
          STATUS: ${{ needs.code.outputs.status }}
          COMMENT: ${{ needs.code.outputs.comment }}
          PUBLISHED: ${{ needs.publish.outputs.status }}
          REASON: ${{ needs.publish.outputs.reason }}
          COST: ${{ needs.code.outputs.cost }}
          MODEL: ${{ needs.code.outputs.model }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          retry="Re-add \`agent-ready\` to try again."
          if [ "$CODE" != success ]; then STATUS=failed; fi
          # After the Code job, Publish's outcome decides: refused, an existing branch, or a failure
          # (with a reason when it got as far as pushing).
          if [ "$STATUS" = done ]; then
            case "$PUBLISHED" in refused | exists) STATUS=$PUBLISHED ;; *) STATUS=${REASON:+pushed}; STATUS=${STATUS:-failed} ;; esac
          fi
          case "$STATUS" in
            questions)
              body=$(printf '%s\n\nAnswer with numbered replies, then re-add `agent-ready`.' "$COMMENT")
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label agent-needs-info ;;
            exists)
              body="An agent branch for this issue already exists (\`agent/issue-$ISSUE-…\`). Close its PR or delete the branch, then re-add \`agent-ready\` to build it again." ;;
            refused)
              body="Nothing was published. $REASON $retry" ;;
            pushed)
              body="$REASON" ;;
            empty)
              body="Claude finished without committing anything, so there was nothing to publish. The run's log has the details. $retry" ;;
            *)
              body="The coding run didn't finish, so nothing was published. The run's log has the details. $retry" ;;
          esac

          footer="Coding run by Claude (${MODEL:-unknown model}) · [run]($RUN_URL)"
          if [ -n "${COST:-}" ]; then footer="$footer · \$$(printf '%.2f' "$COST")"; fi
          printf '%s\n\n<sub>%s</sub>\n' "$body" "$footer" | gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file -

  # When an issue closes (ARCHITECTURE.md, "Triage" and "Releases"): start the agent's sub-issues it
  # was blocking, close a parent whose sub-issues are all closed, and open the release issue once a
  # version's milestone has nothing left open. All text here is fixed; none comes from Claude.
  closed:
    name: After an issue closes
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One at a time, so two issues closing together can't both open the release issue.
    concurrency:
      group: agent-closed
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read # whether a version is released
      issues: write # closing a parent, and comments
      id-token: write # the Claude App token below: issues, and contents read (the exchange requires it)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/agent

      - name: Unblock, close the parent, open the release issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_JSON: ${{ toJSON(github.event.issue) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          repo=$GITHUB_REPOSITORY
          footer="<sub>After #$ISSUE closed · [run]($RUN_URL)</sub>"

          # A Claude App token, only when needed: labels and issues it adds start runs, and ones made
          # with this job's own token wouldn't. Call it outside $( ), so the token is kept and revoked
          # at the end.
          source .github/agent/app-token.sh
          token=""
          app_token() { [ -n "$token" ] || get_app_token '{"issues":"write"}'; }
          trap '[ -z "$token" ] || curl -sS -X DELETE https://api.github.com/installation/token -H "Authorization: Bearer $token" >/dev/null || true' EXIT
          as_app() { GH_TOKEN="$token" "$@"; }

          # 1. The parent of one of the agent's sub-issues closes when they all have. (First, as it
          # needs no App token.)
          if [ "$(jq -r .user.login <<<"$ISSUE_JSON")" = 'claude[bot]' ] \
            && parent=$(gh api "repos/$repo/issues/$ISSUE/parent" 2>/dev/null) \
            && [ "$(jq -r .state <<<"$parent")" = open ]; then
            pnum=$(jq -r .number <<<"$parent")
            open=$(gh api --paginate "repos/$repo/issues/$pnum/sub_issues" --jq '.[] | select(.state == "open") | .number')
            if [ -z "$open" ]; then
              gh issue close "$pnum" --repo "$repo" --reason completed \
                --comment "$(printf 'All its sub-issues are closed.\n\n%s' "$footer")"
            fi
          fi

          # 2. The release issue, once a version's milestone has nothing open: not twice, and not
          # for a version already released. Counted from the issue list rather than the milestone's
          # own count, which can lag just after a close.
          ms_title=$(jq -r '.milestone.title // empty' <<<"$ISSUE_JSON")
          ms_number=$(jq -r '.milestone.number // empty' <<<"$ISSUE_JSON")
          if [[ "$ms_title" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version=${BASH_REMATCH[1]}
            open=$(gh api "repos/$repo/issues?milestone=$ms_number&state=open&per_page=1" --jq length)
            existing=$(gh api --paginate "repos/$repo/issues?milestone=$ms_number&state=all" \
              --jq ".[] | select(.title == \"Release $ms_title\") | .number")
            if [ "$open" = 0 ] && [ -z "$existing" ] && ! gh release view "$ms_title" --repo "$repo" >/dev/null 2>&1; then
              cat > body.md <<BODY
          Everything else in the $ms_title milestone is closed, so it's ready to release.

          Following CLAUDE.md ("How to work"): bump \`package.json\`'s version to $version, move CHANGELOG.md's "Unreleased" notes under it, mark its SPEC.md §9 section released, and replace TESTING.md's "Current release" checklist with checks drawn from those notes. Merging the PR tags the release.

          $footer
          BODY
              if app_token; then
                url=$(as_app gh issue create --repo "$repo" --title "Release $ms_title" --body-file body.md --milestone "$ms_title")
                # Labeled after it's created, so the labeled event starts triage.
                as_app gh issue edit "${url##*/}" --repo "$repo" --add-label agent-ready
              else
                printf 'The %s milestone has nothing left open, but the release issue couldn'"'"'t be opened. Open "Release %s" by hand and label it `agent-ready`.\n\n%s\n' \
                  "$ms_title" "$ms_title" "$footer" | gh issue comment "$ISSUE" --repo "$repo" --body-file -
              fi
            fi
          fi

          # 3. Sub-issues it was blocking: the agent's own (created from a split, so they have a
          # parent) start once every blocker is closed as completed.
          if [ "$(jq -r .state_reason <<<"$ISSUE_JSON")" = completed ]; then
            blocked=$(gh api --paginate "repos/$repo/issues/$ISSUE/dependencies/blocking" \
              --jq '.[] | select(.state == "open" and .user.login == "claude[bot]") | .number')
            for num in $blocked; do
              gh api "repos/$repo/issues/$num/parent" >/dev/null 2>&1 || continue
              waiting=$(gh api --paginate "repos/$repo/issues/$num/dependencies/blocked_by" \
                --jq '.[] | select(.state != "closed" or .state_reason != "completed") | .number')
              labels=$(gh api "repos/$repo/issues/$num" --jq '[.labels[].name | select(startswith("agent-"))] | length')
              if [ -z "$waiting" ] && [ "$labels" = 0 ]; then
                if app_token && as_app gh issue edit "$num" --repo "$repo" --add-label agent-ready; then
                  note='Its blockers are all closed, so it starts now.'
                else
                  note="Its blockers are all closed, but it couldn't be started. Add \`agent-ready\` by hand."
                fi
                printf '%s\n\n%s\n' "$note" "$footer" | gh issue comment "$num" --repo "$repo" --body-file -
              fi
            done
          fi
